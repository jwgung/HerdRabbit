# Install with: herdr plugin install ultivis-iot/HerdRabbit
# The systemd service (npm run install-service) stays the recommended way on
# Linux; while it runs, the startup hook and the start action do nothing.
id = "herdrabbit"
name = "HerdRabbit"
version = "1.2.71"
min_herdr_version = "0.9.0"
description = "Open your Herdr sessions from a phone or another PC (PWA over Tailscale)."
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci", "--omit=dev"]

[[startup]]
command = ["node", "scripts/plugin.mjs", "startup"]

[[actions]]
id = "start"
title = "HerdRabbit: start"
contexts = ["workspace"]
command = ["node", "scripts/plugin.mjs", "start"]

[[actions]]
id = "stop"
title = "HerdRabbit: stop"
contexts = ["workspace"]
command = ["node", "scripts/plugin.mjs", "stop"]

[[actions]]
id = "status"
title = "HerdRabbit: status"
contexts = ["workspace"]
command = ["node", "scripts/plugin.mjs", "status"]

[[actions]]
id = "restart"
title = "HerdRabbit: restart"
contexts = ["workspace"]
command = ["node", "scripts/plugin.mjs", "restart"]

[[panes]]
id = "connect"
title = "HerdRabbit: connect"
placement = "overlay"
command = ["node", "scripts/plugin.mjs", "connect"]

[[panes]]
id = "password"
title = "HerdRabbit: password"
placement = "overlay"
command = ["node", "scripts/plugin.mjs", "password"]
