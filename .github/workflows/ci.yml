name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The committed xterm bundle must be what its pinned sources and patch build.
      - run: npm run check:xterm

  # The Playwright checks in scripts/check-*.mjs, against a fake Herdr.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run check:browser

  # A "release: x.y.z" commit on main becomes the v<x.y.z> tag, once CI has passed.
  tag:
    needs: [verify, browser]
    # every push to main: the newest release commit gets its tag and release
    # once, even when the push that brought it did not (a failed run, or a
    # later commit pushed with it)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the newest release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an annotated tag is made by someone: the Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(git log origin/main --format='%H %s' -20 | grep -P '^[0-9a-f]{40} release: v?[\d.]+$' | head -n1)"
          if [ -z "$commit" ]; then
            echo "No release commit in the recent main history; nothing to tag."
            exit 0
          fi
          sha="${commit%% *}"
          version="${commit##*release: }"
          version="${version#v}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists; skipping."
          else
            # the tag names the release commit itself, not what came after it
            git tag -a "v$version" "$sha" -m "HerdRabbit $version"
            git push origin "v$version"
            gh release create "v$version" --verify-tag --title "HerdRabbit $version" --latest
          fi
