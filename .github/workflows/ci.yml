name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The committed xterm bundle must be what its pinned sources and patch build.
      - run: npm run check:xterm

  # The Playwright checks in scripts/check-*.mjs, against a fake Herdr.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run check:browser

  # Every merge to main is released once CI has passed: the next patch version
  # is committed as "release: x.y.z" (scripts/release.mjs) and tagged, and the
  # tag gets its GitHub release. "[skip release]" in the merged commit's
  # message leaves it for the next release. A "release: x.y.z" commit pushed by
  # hand is tagged as it is. The bot's push starts no new run (pushes made with
  # the workflow's token never do), so the release commit is checked here: it
  # changes the version strings only, and the release test holds them to one.
  release:
    needs: [verify, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one release at a time; a run behind a newer one finds main moved and stops
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Commit the release
        id: bump
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if printf '%s' "$subject" | grep -qP '^release: v?[\d.]+$'; then
            echo "The pushed commit is a release; it is tagged below."
            exit 0
          fi
          if printf '%s' "$MESSAGE" | grep -qF '[skip release]'; then
            echo "[skip release]: no release for this merge."
            exit 0
          fi
          # a newer push is on main: its own run releases both
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; the newer run releases it."
            exit 0
          fi
          git checkout -B main "$GITHUB_SHA"
          version="$(node scripts/release.mjs)"
          node --test test/release-version.test.mjs test/release-script.test.mjs
          git commit -am "release: $version"
          if ! git push origin main; then
            echo "main moved while releasing; the newer run releases it."
            exit 0
          fi
          echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag the newest release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          commit="$(git log origin/main --format='%H %s' -20 | grep -P '^[0-9a-f]{40} release: v?[\d.]+$' | head -n1)"
          if [ -z "$commit" ]; then
            echo "No release commit in the recent main history; nothing to tag."
            exit 0
          fi
          sha="${commit%% *}"
          version="${commit##*release: }"
          version="${version#v}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists; skipping."
          else
            # an annotated tag is made by someone: the Actions bot; it names the
            # release commit itself, not what came after it
            git tag -a "v$version" "$sha" -m "HerdRabbit $version"
            git push origin "v$version"
            gh release create "v$version" --verify-tag --title "HerdRabbit $version" --latest --generate-notes
          fi
